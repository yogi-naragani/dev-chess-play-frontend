<div class="lesson-form-container">
  <div class="page-header">
    <button mat-icon-button routerLink="/instructor/lessons">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>{{ isEdit ? 'Edit Lesson' : 'Create Lesson' }}</h1>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <mat-card *ngIf="!loading">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" placeholder="e.g. Opening Principles">
          <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
          <mat-error *ngIf="form.get('title')?.hasError('minlength')">Minimum 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Lesson description..."></textarea>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Date</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="date">
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error *ngIf="form.get('date')?.hasError('required')">Date is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Time</mat-label>
            <input matInput type="time" formControlName="time">
            <mat-error *ngIf="form.get('time')?.hasError('required')">Time is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Duration</mat-label>
            <mat-select formControlName="duration">
              <mat-option *ngFor="let d of durations" [value]="d">{{ d }} min</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Course</mat-label>
          <mat-select formControlName="courseId">
            <mat-option *ngFor="let course of courses" [value]="course.id">{{ course.name }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('courseId')?.hasError('required')">Course is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Assign Students</mat-label>
          <mat-select formControlName="studentIds" multiple>
            <mat-option *ngFor="let student of availableStudents" [value]="student.id">
              {{ student.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/instructor/lessons">Cancel</button>
          <button mat-raised-button color="primary" type="submit"
                  [disabled]="form.invalid || saving">
            <mat-spinner *ngIf="saving" diameter="20" class="inline-spinner"></mat-spinner>
            {{ saving ? 'Saving...' : (isEdit ? 'Update Lesson' : 'Create Lesson') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
