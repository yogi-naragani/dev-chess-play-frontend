<div class="homework-list-container">
  <div class="page-header">
    <h1>Homework & Assignments</h1>
    <button mat-raised-button color="primary" routerLink="/instructor/homework/new">
      <mat-icon>add</mat-icon> New Assignment
    </button>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="!loading && assignments.length === 0" class="empty-state">
    <mat-icon>assignment</mat-icon>
    <p>No assignments created yet</p>
    <button mat-raised-button color="primary" routerLink="/instructor/homework/new">
      Create Your First Assignment
    </button>
  </div>

  <table mat-table [dataSource]="assignments" *ngIf="!loading && assignments.length > 0" class="homework-table">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let hw">
        <div class="title-cell">
          <mat-icon>{{ getTypeIcon(hw.type) }}</mat-icon>
          <span>{{ hw.title }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let hw">
        <span class="type-chip" [class]="'type-' + hw.type">{{ getTypeLabel(hw.type) }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="dueDate">
      <th mat-header-cell *matHeaderCellDef>Due Date</th>
      <td mat-cell *matCellDef="let hw">
        <span [class.overdue]="isOverdue(hw.dueDate)">
          {{ hw.dueDate | date:'MMM d, y' }}
        </span>
        <mat-icon *ngIf="isOverdue(hw.dueDate)" class="overdue-icon" matTooltip="Overdue">warning</mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="submissions">
      <th mat-header-cell *matHeaderCellDef>Submissions</th>
      <td mat-cell *matCellDef="let hw">
        {{ hw.submissionsCount || 0 }} / {{ hw.assignedStudentIds?.length || 0 }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let hw">
        <button mat-icon-button color="primary" matTooltip="View Submissions"
                [routerLink]="['/instructor/homework', hw.id, 'submissions']">
          <mat-icon>grading</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Edit"
                [routerLink]="['/instructor/homework', hw.id, 'edit']">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Delete"
                (click)="deleteAssignment(hw)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
