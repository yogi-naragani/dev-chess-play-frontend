<div class="course-form">
  <div class="page-header">
    <h1>{{ isEditMode ? 'Edit Course' : 'Create Course' }}</h1>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <mat-card *ngIf="!loading">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Course Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter course name">
          <mat-error *ngIf="form.get('name')?.hasError('required')">Course name is required</mat-error>
          <mat-error *ngIf="form.get('name')?.hasError('minlength')">Minimum 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="4" placeholder="Enter course description"></textarea>
          <mat-error *ngIf="form.get('description')?.hasError('required')">Description is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Level</mat-label>
          <mat-select formControlName="level">
            <mat-option *ngFor="let level of levels" [value]="level">{{ level }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('level')?.hasError('required')">Level is required</mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="cancel()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
            <mat-spinner *ngIf="saving" diameter="20" class="button-spinner"></mat-spinner>
            {{ isEditMode ? 'Update' : 'Create' }} Course
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
