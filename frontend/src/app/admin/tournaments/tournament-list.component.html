<div class="tournament-list">
  <div class="page-header">
    <h1>Tournaments</h1>
    <button mat-raised-button color="primary" (click)="createTournament()">
      <mat-icon>add</mat-icon>
      Create Tournament
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <!-- Loading -->
      <div *ngIf="loading" class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <!-- Table -->
      <div *ngIf="!loading" class="table-container">
        <table mat-table [dataSource]="dataSource" class="full-width">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="format">
            <th mat-header-cell *matHeaderCellDef>Format</th>
            <td mat-cell *matCellDef="let row">{{ row.format }}</td>
          </ng-container>

          <ng-container matColumnDef="timeControl">
            <th mat-header-cell *matHeaderCellDef>Time Control</th>
            <td mat-cell *matCellDef="let row">{{ row.timeControl }}</td>
          </ng-container>

          <ng-container matColumnDef="players">
            <th mat-header-cell *matHeaderCellDef>Players</th>
            <td mat-cell *matCellDef="let row">{{ row.currentPlayers }} / {{ row.maxPlayers }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">
              <span class="status-badge"
                    [style.color]="getStatusColor(row.status)"
                    [style.background-color]="getStatusBgColor(row.status)">
                {{ row.status }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="startDate">
            <th mat-header-cell *matHeaderCellDef>Start Date</th>
            <td mat-cell *matCellDef="let row">{{ row.startDate | date:'medium' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" (click)="editTournament(row)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteTournament(row)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="dataSource.data.length === 0" class="empty-state">
          <mat-icon>emoji_events</mat-icon>
          <p>No tournaments found</p>
          <button mat-raised-button color="primary" (click)="createTournament()">Create First Tournament</button>
        </div>

        <mat-paginator
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
