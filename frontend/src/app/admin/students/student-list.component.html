<div class="student-list">
  <div class="page-header">
    <h1>Students</h1>
    <button mat-raised-button color="primary" (click)="addStudent()">
      <mat-icon>person_add</mat-icon>
      Add Student
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <!-- Search -->
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search students</mat-label>
        <input matInput [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Name or email...">
        <mat-icon matSuffix (click)="onSearch()" style="cursor: pointer;">search</mat-icon>
      </mat-form-field>

      <!-- Loading -->
      <div *ngIf="loading" class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <!-- Table -->
      <div *ngIf="!loading" class="table-container">
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="full-width">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let row">{{ getFullName(row) }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
          </ng-container>

          <ng-container matColumnDef="rating">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Rating</th>
            <td mat-cell *matCellDef="let row">{{ row.rating }}</td>
          </ng-container>

          <ng-container matColumnDef="puzzleRating">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Puzzle Rating</th>
            <td mat-cell *matCellDef="let row">{{ row.puzzleRating }}</td>
          </ng-container>

          <ng-container matColumnDef="gamesPlayed">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Games</th>
            <td mat-cell *matCellDef="let row">{{ row.gamesPlayed }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">
              <span class="status-badge" [class.active]="row.status === 'active'" [class.inactive]="row.status !== 'active'">
                {{ row.status }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" (click)="viewProgress(row)" matTooltip="View Progress">
                <mat-icon>bar_chart</mat-icon>
              </button>
              <button mat-icon-button color="primary" (click)="editStudent(row)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteStudent(row)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="dataSource.data.length === 0" class="empty-state">
          <mat-icon>school</mat-icon>
          <p>No students found</p>
        </div>

        <mat-paginator
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
